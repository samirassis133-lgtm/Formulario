<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario2</title>
</head>

<body>

    <h1> Formulario de Cadastro</h1>
    <hr style="background-color: rgb(225, 8, 8);" size="8">


    <p>Por favor, preencha todos os campos do formulário abaixo para enviar suas informações de cadastro.</p>

    <fieldset style="background-color: rgb(204, 204, 204);">

        <form action=" preencha os dados ">

            <h3>[ Dados Pessoais ]</h3>

            <hr style="background-color: black;" size="3">

            <label for="name">Nome completo:</label>
            <input type="text" name="Nome" id="." size="30" placeholder="nome completo" style="padding-left: 8px;">

            <br><br>

            <label for="numeric">Número:</label>

            <input type="text" name="Numero" id="numeric" maxlength="15" placeholder="(00) 00000-0000"
                inputmode="numeric" style="padding-left: 8px;" oninput="this.value = this.value
        .replace(/\D/g, '')
        .replace(/^(\d{2})(\d)/g, '($1) $2')
        .replace(/(\d{5})(\d)/, '$1-$2')">


            <br><br>

            <label for="e-mail"> E-mail:</label>
            <input type="text" name="e-mail" id="." placeholder="e-mail" style="padding-left: 8px;">

            <br><br>

            <label for="Senha"> Senha:</label>
            <input type="password" name="Senha" id="password" placeholder="senha" maxlength="8"
                style="padding-left: 8px;">


            <br><br>


            <label for="CPF"> CPF: </label>
            <input type="text" name="CPF" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" oninput="this.value = this.value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2') " style="padding-left: 8px;">

            <br><br>


            <label for="Data de Nascimento"> Data de Nascimento: </label>
            <input type="date" name="Data de Nascimento" id="." style="padding-left: 8px;">

            <Br></Br>


            <label for="radio">Gênero:</label> <input type="radio" name="Genero" id="radio"> <label
                for="radio">Masculino</label> <input type="radio" name="Genero" id="radio"> <label
                for="radio">Feminino</label> <input type="radio" name="Genero" id="."> <label for="name">Outro</label>

            <br><br>

            <hr style="background-color: black;" size="3">

            <button> Enviar </button> <button> Limpar </button>
    </fieldset>




    </form>

    <br>

    <hr size="2">

    <br>

            </u> </i> </footer>

    <br>

    <hr>

</body>

</html>
